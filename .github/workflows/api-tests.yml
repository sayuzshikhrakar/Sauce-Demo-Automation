name: API Regression Suite (Newman)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman & Reporters
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Newman Tests
        run: |
          mkdir -p reports
          newman run tests/api/JSONPLACEHOLDER.postman_collection.json \
            -e tests/api/Environment.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html \
            --bail

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman-HTML-Report
          path: reports/newman-report.html