name: k6 Load Tests

on:
  schedule:
    # Runs at 00:00 on Sunday (weekly)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows you to manually trigger the pipeline from the GitHub UI

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Tests
        run: npm run test:load

      - name: Upload k6 HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Report
          path: load-test-reports/k6-report.html
